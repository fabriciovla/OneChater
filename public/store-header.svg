<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#080910"/>
      <stop offset="50%"  stop-color="#0d0e1a"/>
      <stop offset="100%" stop-color="#080910"/>
    </linearGradient>
    <!-- glows centered on 800,150 -->
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(800 150) scale(480 190)">
      <stop offset="0%"   stop-color="#7c3aed" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowL" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(534 150) scale(260 160)">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(1066 150) scale(260 160)">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bottomLine" x1="0" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="36" height="36" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="18" r="0.85" fill="white"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="1600" height="300" fill="url(#bg)"/>
  <rect width="1600" height="300" fill="url(#dots)" opacity="0.065"/>

  <!-- Glows: center + symmetric left/right anchored on the content block -->
  <ellipse cx="800"  cy="150" rx="480" ry="190" fill="url(#glowC)"/>
  <ellipse cx="534"  cy="150" rx="260" ry="160" fill="url(#glowL)"/>
  <ellipse cx="1066" cy="150" rx="260" ry="160" fill="url(#glowR)"/>

  <!--
    LAYOUT — content block 532px wide, centered at x=800
      left edge  = 800 - 532/2 = 534
      right edge = 800 + 532/2 = 1066

    Isotipo scale=2.0:
      blob x-raw=[18,82] → scaled=[36,164] → 128px wide, center_x_raw=100
      blob y-raw=[22,84] → scaled=[44,168] → 124px tall, center_y_raw=106
      offset_x = 534 - 36 = 498   (left blob edge at x=534)
      offset_y = 150 - 106 = 44   (blob group vertically centered at y=150)
      right edge of isotipo = 498 + 164 = 662

    Gap = 24px → wordmark starts at x = 662 + 24 = 686

    Wordmark font-size=76 → cap-height≈55px → visual center ≈ baseline - 27
      To center at y=142 → baseline = 142+27 = 169

    Tagline font-size=18, below wordmark:
      baseline = 169 + 16 + 18 = 203
      starts at x=686, text-anchor=start
  -->

  <!-- Isotipo -->
  <g transform="translate(498, 44) scale(2.0)">
    <path d="M 32 22 Q 18 26 18 40 Q 20 54 34 54 Q 48 52 46 38 Q 44 24 32 22 Z"
          fill="white"/>
    <path d="M 68 26 Q 56 28 54 40 Q 56 54 70 54 Q 84 52 82 38 Q 80 26 68 26 Z"
          fill="white" opacity="0.68"/>
    <path d="M 50 56 Q 36 58 36 72 Q 38 86 52 84 Q 66 82 64 68 Q 62 56 50 56 Z"
          fill="white" opacity="0.42"/>
  </g>

  <!-- Wordmark -->
  <text x="686" y="169"
    font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="76"
    font-weight="600"
    letter-spacing="-2"
    fill="white">One<tspan font-weight="300" opacity="0.66">Chater</tspan>
  </text>

  <!-- Tagline — same left edge as wordmark, spaced below -->
  <text x="686" y="203"
    font-family="Sora, ui-sans-serif, system-ui, -apple-system, sans-serif"
    font-size="17"
    font-weight="400"
    letter-spacing="2.5"
    fill="rgba(255,255,255,0.32)">ONE MEMORY · EVERY AI · YOUR KEYS</text>

  <!-- Bottom accent -->
  <rect x="0" y="297" width="1600" height="3" fill="url(#bottomLine)"/>
</svg>
