<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="frame light">
    <div class="orb" style="width:520px;height:520px;top:240px;left:50%;transform:translateX(-50%);background:rgba(249,115,22,0.16)"></div>

    <div class="eyebrow muted-l top-eyebrow">Memoria por usuario</div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:30px;margin-top:40px">
      <!-- Usuario -->
      <div class="card" style="width:300px;padding:36px;display:flex;flex-direction:column;align-items:center;gap:18px">
        <div class="tile" style="width:84px;height:84px;border-radius:24px">
          <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#131419" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span style="font-size:34px;font-weight:600">Usuario</span>
      </div>

      <svg width="40" height="60" viewBox="0 0 40 60" fill="none"><path d="M20 4 V48" stroke="#C9C7BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/><path d="M10 42 L20 54 L30 42" stroke="#C9C7BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <!-- Memoria Personal (hub, naranja) -->
      <div style="position:relative">
        <div class="orb" style="width:420px;height:420px;top:-90px;left:-60px;background:rgba(249,115,22,0.28)"></div>
        <div class="card" style="position:relative;width:420px;padding:44px;display:flex;flex-direction:column;align-items:center;gap:20px">
          <div style="width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,#f97316,#f59e0b);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px -12px rgba(249,115,22,0.6)">
            <svg viewBox="0 0 24 24" width="50" height="50" fill="#fff">
              <path d="M7.4 4Q3.6 5 3.6 8.6Q4.1 12.5 7.6 12.5Q11.1 12 10.7 8.4Q10.3 4.5 7.4 4Z"/>
              <path d="M16.4 5Q13.4 5.5 13 8.6Q13.5 12.5 16.6 12.5Q20.4 12 20 8.4Q19.6 5.5 16.4 5Z"/>
              <path d="M12 13.5Q8.4 14 8.4 17.5Q8.9 21 12.4 20.5Q15.9 20 15.5 16.5Q15 13.5 12 13.5Z"/>
            </svg>
          </div>
          <span style="font-size:38px;font-weight:600">Memoria Personal</span>
          <span style="font-size:26px;color:#9A9A92">privada y cifrada</span>
        </div>
      </div>

      <svg width="40" height="60" viewBox="0 0 40 60" fill="none"><path d="M20 4 V48" stroke="#C9C7BF" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 8"/><path d="M10 42 L20 54 L30 42" stroke="#C9C7BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>

      <!-- 3 modelos -->
      <div style="display:flex;gap:24px">
        <div class="tile" style="width:118px;height:118px;border-radius:30px">

        </div>
        <div class="tile" style="width:118px;height:118px;border-radius:30px">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="#D97757"><path d="M13.827 3.52h3.603L24 20h-3.603l-6.57-16.48zm-7.258 0h3.767L16.906 20h-3.674l-1.343-3.461H5.017L3.674 20H0L6.57 3.52zm4.132 9.959L8.453 7.687 6.205 13.48H10.7z"/></svg>
        </div>
        <div class="tile" style="width:118px;height:118px;border-radius:30px">
          <svg viewBox="0 0 24 24" width="56" height="56" fill="none">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
        </div>
      </div>
    </div>

    <h2 class="display bottom-note" style="font-size:62px;font-weight:600">Tu contexto, en<br>todos los modelos.</h2>
  </div>
</body>
</html>
