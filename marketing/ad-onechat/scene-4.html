<!doctype html>
<html lang="es">
<head>

  <div class="frame light" style="justify-content:flex-start;padding-top:330px">

          <span style="font-size:30px;font-weight:600">GPT</span>
          <span class="dot" style="background:#22c55e;margin-left:auto"></span>
        </div>
        <div class="skl" style="margin-bottom:14px"></div>
        <div class="skl" style="width:82%;margin-bottom:14px"></div>
        <div class="skl" style="width:58%"></div>
      </div>

      <!-- Claude -->
      <div class="card" style="flex:1;padding:34px 28px">
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:30px">
          <div class="tile">

        <div class="skl" style="margin-bottom:14px"></div>
        <div class="skl" style="width:76%;margin-bottom:14px"></div>
        <div class="skl" style="width:64%"></div>
      </div>

      <!-- Gemini -->

        <div style="display:flex;align-items:center;gap:16px;margin-bottom:30px">

            <svg viewBox="0 0 24 24" width="40" height="40" fill="none">

        </div>
        <div class="skl" style="margin-bottom:14px"></div>
        <div class="skl" style="width:80%;margin-bottom:14px"></div>
        <div class="skl" style="width:54%"></div>
      </div>
    </div>

    <h2 class="display" style="font-size:70px;font-weight:600;margin-top:100px">Un mensaje.<br>Tres respuestas.</h2>
  </div>
</body>
</html>
